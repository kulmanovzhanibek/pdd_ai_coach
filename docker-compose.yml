services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pdd
      POSTGRES_PASSWORD: pdd
      POSTGRES_DB: pdd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Веб-админка для просмотра базы: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Слушать IPv4: в Docker без IPv6 pgAdmin иначе не стартует
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      # Режим «десктопа»: без логина в саму админку, только для локальной разработки
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # pgAdmin требует у файла паролей права 600, поэтому создаём его при старте
    entrypoint: >
      /bin/sh -c "echo 'db:5432:*:pdd:pdd' > /tmp/pgpassfile
      && chmod 600 /tmp/pgpassfile
      && exec /entrypoint.sh"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin:
