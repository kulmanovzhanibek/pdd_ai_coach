[project]
name = "pdd-ai-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kulmanov", email = "kul.zhanibek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pypdf==5.9.0",
    "selectolax>=0.4.12",
    "sqlalchemy[asyncio]>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
